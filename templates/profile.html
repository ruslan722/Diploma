<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль пользователя</title>
    <link rel="stylesheet" href="/static/style.css">    
    <script src="/static/js/app.js"></script>

    

</head>
<body>
    <div class="container">
        <h1>Профиль пользователя</h1>
        <div id="quotes-container">
            {% for quote in profiles %}
                <div class="quote-card">
                    <p class="username">{{ quote.username }}</p>
                    <p class="nickname"> {{ quote.nickname }}</p>
                    <p class="avatar_path"> {{ quote.avatar_path }}</p>
                    <p class="created_at"> {{ quote.created_at }}</p>
                </div>
            {% endfor %}
        </div>
    </div>
    
</body>
</html>
